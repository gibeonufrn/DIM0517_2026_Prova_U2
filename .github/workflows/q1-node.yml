name: Node - Questão 1

on:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'node/src/**'
      - 'node/Dockerfile'
      - 'node/package.json'
      
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Check
        run: node --check src/index.js