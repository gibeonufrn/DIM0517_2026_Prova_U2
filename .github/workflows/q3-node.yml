name: Node

on:
  pull_request:
    types: [closed]
    branches:
      - develop

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Check
        run: node --check src/index.js

  docker-build:
    if: github.event.pull_request.merged == true
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build -t my-node-app .

  tag:
    if: github.event.pull_request.merged == true
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create and push tag
        env:
          TAG: build-${{ github.run_id }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
      
