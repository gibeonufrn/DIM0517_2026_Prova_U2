name: Java

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn clean package

      - name: Construindo e rodando a imagem Docker
        run: |
          docker build -t aplicacao-java:v.1 .
          docker run -d -p 8080:5000 aplicacao-java:v.1