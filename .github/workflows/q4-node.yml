name: Node - questão 4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Check
        run: node --check src/index.js

      - name: Unit tests
        run: npm test

      - name: Build Docker Image
        run: docker build -t my-node-app .

      - name: Run Docker Container
        run: docker run --detach --name my-node-app -p 8080:8080 my-node-app

