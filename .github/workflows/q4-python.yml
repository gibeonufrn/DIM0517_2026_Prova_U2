name: Python

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Check
        run: python -m py_compile src/main.py
      - name: Test
        run: |
          pytest -v
      - name: Build_Docker
        run: docker build -t apisaude:1.0 .
      - name: Subir_Docker
        run: docker run -d -p 8080:8080 --name api apisaude:1.0